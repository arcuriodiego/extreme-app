# Se ejecuta en cada cambio subido a GitHub. Si algo falla, el cambio no se publica.
name: Verificación

on:
  push:
    branches: [main]
  pull_request:

jobs:
  reglas:
    name: Reglas de negocio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  base-de-datos:
    name: Base de datos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  app:
    name: Compilación de la app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Cuando exista package-lock.json conviene cambiar a "npm ci".
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  # Aplica las migraciones nuevas a la base de staging en Supabase.
  # Sólo corre en la rama main y sólo si las pruebas de la base pasaron.
  publicar-base-staging:
    name: Publicar base en staging
    needs: [base-de-datos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: base-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Verificar credenciales
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Faltan los secretos de Supabase en GitHub; no se publicó la base."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.creds.outputs.ok == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - if: steps.creds.outputs.ok == 'true'
        run: supabase db push
