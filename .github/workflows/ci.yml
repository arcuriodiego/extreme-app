# Se ejecuta en cada cambio subido a GitHub. Si algo falla, el cambio no se publica.
name: Verificación

on:
  push:
    branches: [main, produccion]
  pull_request:

jobs:
  reglas:
    name: Reglas de negocio
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  base-de-datos:
    name: Base de datos
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/test-db.sh
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  app:
    name: Compilación de la app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # Cuando exista package-lock.json conviene cambiar a "npm ci".
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - name: Lint
        run: |
          set -o pipefail
          if ! npm run lint 2>&1 | tee lint.log; then
            echo "::error title=Falló el lint::$(grep -E 'error|warning|^/' lint.log | head -n 30 | sed -e 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi
      - name: Compilar
        run: |
          set -o pipefail
          if ! npm run build 2>&1 | tee build.log; then
            # Muestra el final del registro como aviso, visible desde el resumen de la ejecución.
            { grep -iE -A6 "error|⨯|failed" build.log | head -n 40; echo "-----"; tail -n 15 build.log; } > build-error.log
            echo "::error title=Falló la compilación::$(sed -e 's/%/%25/g' build-error.log | sed ':a;N;$!ba;s/\n/%0A/g')"
            exit 1
          fi

  # Aplica las migraciones nuevas a la base de staging en Supabase.
  # Sólo corre en la rama main y sólo si las pruebas de la base pasaron.
  publicar-base-staging:
    name: Publicar base en staging
    needs: [base-de-datos]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: base-staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Verificar credenciales
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::warning::Faltan los secretos de Supabase en GitHub; no se publicó la base."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.creds.outputs.ok == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: steps.creds.outputs.ok == 'true'
        run: |
          set -o pipefail
          supabase --version
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee link.log; then
            echo "::error title=supabase link::$(supabase --version) $(tail -n 15 link.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
      - if: steps.creds.outputs.ok == 'true'
        # Si falla, el error queda como anotación del job (se lee sin descargar el registro completo).
        run: |
          set -o pipefail
          if ! supabase db push 2>&1 | tee push.log; then
            echo "::error title=supabase db push::$(tail -n 15 push.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi

  # Producción: se publica sólo al subir la rama "produccion" (después de probar en pruebas
  # y con el OK de Diego). Usa los secretos PROD_* de la cuenta de Supabase de la academia.
  publicar-base-produccion:
    name: Publicar base en producción
    needs: [base-de-datos, reglas]
    if: github.event_name == 'push' && github.ref == 'refs/heads/produccion'
    runs-on: ubuntu-latest
    concurrency: base-produccion
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PROD_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.PROD_SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v5
      - name: Verificar credenciales
        id: creds
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Faltan los secretos PROD_SUPABASE_* en GitHub; no se publicó la base de producción."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: |
          set -o pipefail
          if ! supabase link --project-ref "$SUPABASE_PROJECT_REF" 2>&1 | tee link.log; then
            echo "::error title=supabase link (producción)::$(tail -n 15 link.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
      - name: Migraciones que se van a aplicar
        run: supabase migration list 2>&1 | tail -n 40
      - run: |
          set -o pipefail
          if ! supabase db push 2>&1 | tee push.log; then
            echo "::error title=supabase db push (producción)::$(tail -n 15 push.log | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
